<section>
    <h2>Adicionar Usuário</h2>
    <form #form="ngForm" (ngSubmit)="adicionarUsuario()">
        <label for="nome">Nome:</label>
        <input type="text" 
        id="nome" 
        [(ngModel)]="nome" 
        name="nome" 
        required>

        <label for="email">Email:</label>
        <input type="email"
        id="email" 
        [(ngModel)]="email" 
        name="email" required>

        <button type="submit">Adicionar</button>
    </form>
    <h3>Usuários Adicionados:</h3>
    <ul>
        @for (usuario of usuarios; track $index) {
            <li>{{ usuario.nome }} - {{ usuario.email }}</li>
        }
    </ul>
</section>
